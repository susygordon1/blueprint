<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stories | Seeker of Story</title>
  <meta name="description" content="Watch real stories of challenge, faith, business and transformation from the Seeker of Story community.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Satisfy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stories">
<main>
  <header class="page-hero">
    <div class="container">
      <p class="eyebrow">Real stories</p>
      <h1>Stories of <span class="script">Transformation</span></h1>
      <p>Everyday people, honest moments, and the turning points that changed everything.</p>
    </div>
  </header>
  <section class="section-light">
    <div class="container">
      <div class="toolbar">
        <div class="chips" id="storyChips" role="toolbar" aria-label="Filter by category"></div>
        <input class="search-input" id="storySearch" type="search" placeholder="Search stories…" aria-label="Search stories">
      </div>
      <div class="grid grid-3" id="storyGrid"></div>
    </div>
  </section>

  <div class="cta-band">
    <div class="container">
      <h2>Have a story like these?</h2>
      <p>Your story could be the turning point someone else is waiting for.</p>
      <div class="hero-ctas">
        <a class="btn btn-gold" href="share.html">Share Your Story</a>
        <a class="btn btn-ghost" href="#" data-youtube>See all on YouTube</a>
      </div>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
